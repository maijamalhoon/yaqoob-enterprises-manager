<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop Pro</title>
    <meta
      name="description"
      content="Production-oriented multi-tenant business management system for physical service and retail shops, photocopying, printing, documentation centers, stationery, and ticket booking."
    />
    <meta property="og:title" content="Shop Pro" />
    <meta
      property="og:description"
      content="Production-oriented multi-tenant business management system for physical service and retail shops, photocopying, printing, documentation centers, stationery, and ticket booking."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#17654e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Shop Pro" />
    <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
    <link rel="apple-touch-icon" href="/assets/icon-192.png" />
    <style>
      html {
        background-color: #f6f8f7;
      }
      html.dark {
        background-color: #111a15;
      }
    </style>
    <script>
      try {
        if (localStorage.getItem("yaqoob-theme") === "dark") {
          document.documentElement.classList.add("dark");
        }
      } catch {
        // Default to the light theme when browser storage is unavailable.
      }
    </script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch(console.error);
        });
      }
    </script>
  </head>
  <body
    class="h-full antialiased font-sans"
  >
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
